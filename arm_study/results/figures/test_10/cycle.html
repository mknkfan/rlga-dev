    a = toScreen([fx,y0,0],v); b = toScreen([fx,y1,0],v);
    cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke();
    a = toScreen([x0,fy,0],v); b = toScreen([x1,fy,0],v);
    cx.beginPath(); cx.moveTo(a[0],a[1]); cx.lineTo(b[0],b[1]); cx.stroke();
  }

  cx.strokeStyle = '#4a5563'; cx.lineWidth = 1.2; cx.beginPath();
  for (i = 0; i <= 48; i++) {
    var th = i/48*Math.PI*2;
    var p = toScreen([S.base[0]+S.keepOut*Math.cos(th),
                      S.base[1]+S.keepOut*Math.sin(th), 0], v);
    if (i) { cx.lineTo(p[0],p[1]); } else { cx.moveTo(p[0],p[1]); }
  }
  cx.stroke();

  /* Painter's algorithm over every face: this is what makes the boxes occlude
     each other correctly from any angle. */
  var faces = [];
  for (i = 0; i < S.boxes.length; i++) {
    var box = S.boxes[i];
    for (var f = 0; f < box.faces.length; f++) {
      var pts = box.faces[f].map(function (p) { return toScreen(p, v); });
      var d = 0;
      for (var k = 0; k < pts.length; k++) { d += pts[k][2]; }
      faces.push({pts: pts, depth: d/pts.length, fi: f, name: box.name, order: box.order});
    }
  }
  faces.sort(function (a, b) { return a.depth - b.depth; });
  var shade = ['#8fa9cf','#3d5477','#5b7aa8','#4a6690','#5b7aa8','#4a6690'];
  faces.forEach(function (fc) {
    cx.fillStyle = shade[fc.fi]; cx.strokeStyle = '#1b2734'; cx.lineWidth = 1;
    cx.beginPath(); cx.moveTo(fc.pts[0][0], fc.pts[0][1]);
    for (var j = 1; j < fc.pts.length; j++) { cx.lineTo(fc.pts[j][0], fc.pts[j][1]); }
    cx.closePath(); cx.fill(); cx.stroke();
    if (fc.fi === 0) {
      var mx = 0, my = 0;
      fc.pts.forEach(function (p) { mx += p[0]/fc.pts.length; my += p[1]/fc.pts.length; });
      cx.fillStyle = '#10203a'; cx.font = '11px system-ui'; cx.textAlign = 'center';
      cx.fillText(fc.name + ' #' + fc.order, mx, my + 4);
    }
  });

  cx.strokeStyle = '#e05252'; cx.lineWidth = 1.8; cx.beginPath();
  for (i = 0; i <= frame; i++) {
    var tp = toScreen(S.tool[i], v);
    if (i) { cx.lineTo(tp[0],tp[1]); } else { cx.moveTo(tp[0],tp[1]); }
  }
  cx.stroke();

  S.ports.forEach(function (pt) {
    var p = toScreen(pt, v);
    cx.fillStyle = '#e05252';
    cx.beginPath(); cx.arc(p[0],p[1],3.4,0,Math.PI*2); cx.fill();
  });

  var link = S.arm[frame];
  cx.strokeStyle = '#5aa9e6'; cx.lineWidth = 3.4; cx.lineJoin = 'round';
  cx.beginPath();
  link.forEach(function (p, i2) {
    var q = toScreen(p, v);
    if (i2) { cx.lineTo(q[0],q[1]); } else { cx.moveTo(q[0],q[1]); }
  });
  cx.stroke();
  link.forEach(function (p) {
    var q = toScreen(p, v);
    cx.fillStyle = '#cfe6f7';
    cx.beginPath(); cx.arc(q[0],q[1],3.6,0,Math.PI*2); cx.fill();
  });

  document.getElementById('clock').textContent =
    't = ' + S.t[frame].toFixed(3) + ' s   |   az ' + (az*180/Math.PI).toFixed(0) +
    '\u00b0, elev ' + (el*180/Math.PI).toFixed(0) + '\u00b0';
}

cv.addEventListener('pointerdown', function (e) {
  dragging = true; shift = e.shiftKey; lastX = e.clientX; lastY = e.clientY;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointerup', function () { dragging = false; });
cv.addEventListener('pointermove', function (e) {
  if (!dragging) { return; }
  var dx = e.clientX - lastX, dy = e.clientY - lastY;
  lastX = e.clientX; lastY = e.clientY;
  if (shift) { panX += dx; panY += dy; }
  else {
    az += dx*0.008;
    el = Math.max(-Math.PI/2+0.05, Math.min(Math.PI/2-0.05, el + dy*0.006));
  }
  draw();
});
cv.addEventListener('wheel', function (e) {
  e.preventDefault();
  zoom = Math.max(0.35, Math.min(6, zoom*(e.deltaY < 0 ? 1.1 : 1/1.1)));
  draw();
}, {passive:false});

document.getElementById('play').addEventListener('click', function (e) {
  playing = !playing; e.target.textContent = playing ? 'Pause' : 'Play';
});
scrub.addEventListener('input', function (e) {
  playing = false; document.getElementById('play').textContent = 'Play';
  frame = +e.target.value; draw();
});
document.getElementById('reset').addEventListener('click', function () {
  az = -58*Math.PI/180; el = 22*Math.PI/180; zoom = 1; panX = 0; panY = 0; draw();
});
document.getElementById('top').addEventListener('click', function () {
  az = -90*Math.PI/180; el = 89*Math.PI/180; draw();
});

var last = 0;
function tick(now) {
  if (playing && now - last > 40) {
    last = now; frame = (frame + 1) % S.arm.length; scrub.value = frame; draw();
  }
  requestAnimationFrame(tick);
}
resize();
requestAnimationFrame(tick);
</script>
